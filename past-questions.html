<style>
:root {
  --bg-deep: #0a0a0f;
  --bg-card: #12121a;
  --bg-elevated: #181822;
  --border: #2a2a3a;
  --border-light: #3a3a4a;
  --accent: #5b7ff5;
  --accent-bright: #7b9aff;
  --gold: #e8c547;
  --teal: #3db8a0;
  --purple: #a073d9;
  --text: #e0e0ec;
  --text-dim: #a0a0b8;
  --text-muted: #7a7a94;
  --film-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Sans 3', sans-serif; background: var(--bg-deep); color: var(--text); line-height: 1.7; min-height: 100vh; }
body::before { content: ''; position: fixed; inset: 0; background: var(--film-grain); pointer-events: none; z-index: 9999; opacity: 0.35; }

/* ── SITE CONTENT ── */
.site-content { display: none; }
.site-content.visible { display: block; }

/* ── HERO ── */
.hero {
  position: relative;
  padding: 3.5rem 2rem 3rem;
  text-align: center;
  background: linear-gradient(180deg, #10101a 0%, var(--bg-deep) 100%);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -50%; left: 50%;
  transform: translateX(-50%);
  width: 900px; height: 900px;
  background: radial-gradient(ellipse, rgba(91,127,245,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.hero-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 0.8rem; position: relative;
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.4rem; font-weight: 700; line-height: 1.15;
  margin-bottom: 0.8rem; position: relative;
}
.hero h1 em { font-style: italic; color: var(--accent-bright); }
.hero-sub {
  color: var(--text-dim); font-size: 1.05rem;
  max-width: 680px; margin: 0 auto; position: relative;
}

/* ── BACK LINK ── */
.back-link {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  letter-spacing: 0.1em; color: var(--text-muted);
  text-decoration: none; position: relative;
  transition: color 0.2s; margin-bottom: 1rem;
}
.back-link:hover { color: var(--accent-bright); }

/* ── INNER CONTAINER ── */
.inner { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* ── STICKY NAV ── */
.sticky-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,15,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 0;
}
.sticky-nav-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; gap: 0.5rem; flex-wrap: wrap;
  justify-content: center; padding: 0 1.5rem;
}
.sticky-nav button {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); padding: 0.5rem 1.1rem;
  border-radius: 6px; font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.08em;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.sticky-nav button:hover { color: var(--text); border-color: var(--border-light); }
.sticky-nav button.active { color: var(--accent-bright); border-color: var(--accent); background: rgba(91,127,245,0.08); }

/* ── FILTER ── */
.filter-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; align-items: center; }
.filter-label { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; }
.filter-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); padding: 0.4rem 0.9rem;
  border-radius: 5px; font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.08em;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.filter-btn:hover { color: var(--text-dim); border-color: var(--border-light); }
.filter-btn.active { color: var(--accent-bright); border-color: var(--accent); background: rgba(91,127,245,0.08); }

/* ── YEAR BLOCK ── */
.year-block { scroll-margin-top: 80px; margin-bottom: 3.5rem; }
.year-header {
  display: flex; align-items: baseline; gap: 1rem;
  padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
  margin-bottom: 1.2rem; flex-wrap: wrap;
}
.year-title { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: var(--text); font-weight: 700; }
.year-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }

/* ── SECTION HEAD ── */
.section-head {
  display: flex; align-items: center; gap: 0.75rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.67rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  margin: 1.4rem 0 0.75rem;
}
.section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.section-head.s1 { color: var(--teal); }
.section-head.s2 { color: var(--purple); }
.marks-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 0.63rem;
  color: var(--text-muted); background: var(--bg-elevated);
  border: 1px solid var(--border); padding: 0.1rem 0.5rem;
  border-radius: 3px; white-space: nowrap;
}

/* ── STIMULUS NOTE ── */
.stimulus-note {
  background: rgba(61,184,160,0.06); border: 1px solid rgba(61,184,160,0.28);
  border-left: 2px solid var(--teal); border-radius: 6px;
  padding: 0.75rem 1rem; margin-bottom: 1rem;
  font-size: 0.88rem; color: var(--text-dim);
}
.stimulus-note strong { color: var(--text); }

/* ── QUESTION CARDS ── */
.q-list { display: flex; flex-direction: column; gap: 0.5rem; }
.q-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.95rem 1.2rem;
  display: flex; gap: 1rem; align-items: flex-start;
  transition: border-color 0.18s;
}
.q-card:hover { border-color: var(--border-light); }
.q-card.s1-card { border-left: 2px solid var(--teal); }
.q-card.s2-card { border-left: 2px solid var(--purple); }
.q-num {
  font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
  font-weight: 700; min-width: 1.6rem; flex-shrink: 0; padding-top: 0.1rem;
}
.q-num.s1 { color: var(--teal); }
.q-num.s2 { color: var(--purple); }
.q-body { flex: 1; }
.q-text { color: var(--text); font-size: 0.97rem; line-height: 1.55; }
.q-sub { margin-top: 0.65rem; padding-left: 0.75rem; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.4rem; }
.q-sub-row { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.9rem; color: var(--text-dim); }
.q-sub-marks { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--accent-bright); flex-shrink: 0; min-width: 2rem; font-weight: 700; padding-top: 0.05rem; }

/* ── FOOTER ── */
.footer {
  text-align: center; padding: 2.5rem 1.5rem 2rem;
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--text-muted); letter-spacing: 0.15em;
  border-top: 1px solid var(--border); margin-top: 2rem;
}

@media (max-width: 600px) {
  .hero { padding: 2.5rem 1rem 2rem; }
  .hero h1 { font-size: 1.9rem; }
  .inner { padding: 1.5rem 1rem 3rem; }
}
</style>
</head>

function buildNav() {
  var nav = document.getElementById('yearNav');
  var html = '';
  for (var i = 0; i < years.length; i++) {
    html += '<button data-target="' + years[i].id + '">' + years[i].year + '</button>';
  }
  nav.innerHTML = html;
  nav.firstElementChild.classList.add('active');
}

function buildSubRows(sub) {
  var html = '<div class="q-sub">';
  for (var i = 0; i < sub.length; i++) {
    html += '<div class="q-sub-row">';
    html += '<div class="q-sub-marks">(' + sub[i].m + ')</div>';
    html += '<div>' + sub[i].t + '</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

    for (var j = 0; j < y.s1.length; j++) {
      html += '<div class="q-card s1-card">';
      html += '<div class="q-num s1">' + (j + 1) + '.</div>';
      html += '<div class="q-body"><div class="q-text">' + y.s1[j] + '</div></div>';
      html += '</div>';
    }
    html += '</div></div>';

    // Section Two
    html += '<div class="s2-block">';
    html += '<div class="section-head s2">Section Two — Extended Answer <span class="marks-badge">' + y.s2marks + '</span></div>';
    html += '<div class="q-list">';
    for (var k = 0; k < y.s2.length; k++) {
      var q = y.s2[k];
      html += '<div class="q-card s2-card">';
      html += '<div class="q-num s2">' + (k + 1) + '.</div>';
      html += '<div class="q-body"><div class="q-text">' + q.q + '</div>';
      if (q.sub) {
        html += buildSubRows(q.sub);
      }
      html += '</div></div>';
    }
    html += '</div></div>';

    html += '</div>'; // year-block
  }

  root.innerHTML = html;
}

function setupFilter() {
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      this.classList.add('active');
      var f = this.getAttribute('data-filter');
      var s1 = document.querySelectorAll('.s1-block');
      var s2 = document.querySelectorAll('.s2-block');
      for (var k = 0; k < s1.length; k++) s1[k].style.display = (f === 's2') ? 'none' : '';
      for (var k = 0; k < s2.length; k++) s2[k].style.display = (f === 's1') ? 'none' : '';
    });
  }
}

function setupStickyNav() {
  var buttons = document.querySelectorAll('#yearNav button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var target = document.getElementById(this.getAttribute('data-target'));
      if (target) {
        var top = target.getBoundingClientRect().top + window.pageYOffset - 70;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    });
  }
  window.addEventListener('scroll', function() {
    var scrollY = window.pageYOffset + 120;
    var active = years[0].id;
    for (var i = 0; i < years.length; i++) {
      var el = document.getElementById(years[i].id);
      if (el && el.offsetTop <= scrollY) active = years[i].id;
    }
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-target') === active) {
        buttons[i].classList.add('active');
      } else {
        buttons[i].classList.remove('active');
      }
    }
  });
}

function init() {
  buildNav();
  buildQuestions();
  setupFilter();
  setupStickyNav();
}

if (localStorage.getItem('mpa_auth') !== 'true') {
  window.location.href = 'index.html';
} else {
  document.getElementById('siteContent').classList.add('visible');
  init();
}
</script>
<script src="countdown.js" defer></script>
</body>
